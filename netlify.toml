# Netlify Configuration File
# This file configures Netlify deployment settings

[build]
  # Use build script to prevent Python detection
  command = "bash netlify-build.sh"
  publish = "."
  
  # Completely disable Python auto-detection
  [build.environment]
    # Disable mise Python detection completely
    MISE_SKIP_PYTHON = "1"
    # Don't install Python
    SKIP_PYTHON_INSTALL = "1"
  
  # Redirect all routes to index.html for SPA behavior
  [[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/website/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables (if needed)
# [build.environment]
#   NODE_VERSION = "18"

